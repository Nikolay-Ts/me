<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nik Tsonev</title>
  <meta name="description" content="Nik Tsonev's personal website, styled as a Windows XP desktop.">
  <link rel="stylesheet" href="css/style.xp.css">
</head>
<body>
  <div id="desktop">
    <div id="desktop-icons"></div>
    <div id="windows-layer"></div>
  </div>

  <div id="taskbar">
    <button type="button" id="start-button">
      <span id="start-flag" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="16" height="16">
          <rect x="1" y="1" width="8" height="8" fill="#f25022"/>
          <rect x="11" y="1" width="8" height="8" fill="#7fba00"/>
          <rect x="1" y="11" width="8" height="8" fill="#00a4ef"/>
          <rect x="11" y="11" width="8" height="8" fill="#ffb900"/>
        </svg>
      </span>
      <span id="start-label">start</span>
    </button>
    <div id="start-menu" hidden></div>
    <div id="taskbar-apps"></div>

    <div id="taskbar-tray">
      <a class="tray-link" id="tray-github" href="https://github.com/Nikolay-Ts"
         target="_blank" rel="noopener" title="GitHub — Nikolay-Ts" aria-label="GitHub">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
      <a class="tray-link" id="tray-linkedin" href="https://www.linkedin.com/in/nikolay-tsonev-a8a498226"
         target="_blank" rel="noopener" title="LinkedIn — Nikolay Tsonev" aria-label="LinkedIn">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M13.63 13.63h-2.37V9.9c0-.89-.02-2.04-1.24-2.04-1.25 0-1.44.97-1.44 1.97v3.8H6.21V6.25h2.28v1.01h.03c.32-.6 1.09-1.24 2.25-1.24 2.4 0 2.85 1.58 2.85 3.64v3.97zM3.54 5.23a1.38 1.38 0 1 1 0-2.76 1.38 1.38 0 0 1 0 2.76zm1.19 8.4H2.35V6.25h2.38v7.38zM14.82 0H1.18C.53 0 0 .52 0 1.16v13.68C0 15.48.53 16 1.18 16h13.64c.65 0 1.18-.52 1.18-1.16V1.16C16 .52 15.47 0 14.82 0z"/>
        </svg>
      </a>
      <button type="button" class="tray-link" id="tray-sound" title="Mute click sound"
              aria-label="Toggle click sound" aria-pressed="true">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M7.2 2.4 4.1 5H2.2a.8.8 0 0 0-.8.8v4.4a.8.8 0 0 0 .8.8h1.9l3.1 2.6a.5.5 0 0 0 .8-.4V2.8a.5.5 0 0 0-.8-.4z"/>
          <g class="sound-waves" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
            <path d="M10.4 5.8a3 3 0 0 1 0 4.4"/>
            <path d="M12.3 4a5.6 5.6 0 0 1 0 8"/>
          </g>
          <path class="sound-mute" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                d="M10.6 6.2 14 9.8M14 6.2l-3.4 3.6"/>
        </svg>
      </button>
      <button type="button" class="tray-link" id="tray-shutdown" title="Turn off computer" aria-label="Turn off computer">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                d="M8 2.2v5.4M4.6 4a5 5 0 1 0 6.8 0"/>
        </svg>
      </button>
    </div>

    <div id="taskbar-clock"></div>
  </div>

  <div id="shutdown-screen" hidden>
    <div id="shutdown-inner">
      <p id="shutdown-message">Windows is shutting down&hellip;</p>
      <button type="button" id="shutdown-restart" class="xp-button" hidden>Turn back on</button>
    </div>
  </div>

  <script src="js/sound.js" defer></script>
  <script src="js/markdown.js" defer></script>
  <script src="js/content.js" defer></script>
  <script src="js/windows.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
